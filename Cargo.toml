[workspace]
resolver = "2"
members = [
    "crates/echo-core",
    "crates/echo-innertube",
    "crates/echo-playback",
    "crates/echo-lyrics",
    "crates/echo-discord",
    "crates/echo-app",
]
default-members = ["crates/echo-app"]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "GPL-3.0"
authors = ["Echo Music Desktop Contributors"]
repository = "https://github.com/EchoMusicApp/Echo-Music-Desktop"
homepage = "https://echomusic.fun"
description = "Echo Music for Desktop - ad-free music streaming, synced lyrics and offline playback."

[workspace.dependencies]
# ---- internal crates -------------------------------------------------------
echo-core = { path = "crates/echo-core" }
echo-innertube = { path = "crates/echo-innertube" }
echo-playback = { path = "crates/echo-playback" }
echo-lyrics = { path = "crates/echo-lyrics" }
echo-discord = { path = "crates/echo-discord" }

# ---- serialization ---------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ---- error handling / logging ---------------------------------------------
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

# ---- async-free HTTP (worker threads use the blocking client) --------------
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
    "charset",
    "http2",
] }

# ---- persistence -----------------------------------------------------------
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
directories = "5"

# ---- audio -----------------------------------------------------------------
rodio = { version = "0.20", features = ["symphonia-all"] }

# ---- misc ------------------------------------------------------------------
regex = "1"
once_cell = "1"
parking_lot = "0.12"
urlencoding = "2"
base64 = "0.22"
sha1 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
lru = "0.12"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }

# ---- UI --------------------------------------------------------------------
# Pinned to the exact released minor+patch. Slint's declarative API still moves
# between patch releases (`vertical-alignment` on non-Text elements, the
# `TextInput.edited` signature, `ScrollView` moving into `std-widgets`), so a
# bare "1.8" caret requirement silently resolves to 1.18 and breaks the build.
slint = "=1.18.1"
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
