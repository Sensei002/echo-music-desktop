name: Release

# Publishes a GitHub Release every time a `v*` tag is pushed. The tag is the
# version - for example `v1.4.0` produces release `v1.4.0` with a packaged
# Windows binary.
#
# Windows x64 only for now; Linux and macOS were dropped because the workspace
# did not build on either host. Add rows back to the matrix once those
# platforms can be built and verified.
#
# Cut a release with:
#   git tag v1.4.0 && git push origin v1.4.0
#
# You can also run this workflow manually from the Actions tab and supply the
# version; it will create the tag for you.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.4.0 (a tag will be created)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Build the packaged Windows artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Package (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      # See the note in ci.yml: Git for Windows ships a GNU `link.exe` that
      # shadows the MSVC linker and breaks every link step.
      - name: Put the MSVC linker ahead of Git's
        shell: pwsh
        run: |
          $roots = @()
          if ($env:MSYS2_ROOT) { $roots += $env:MSYS2_ROOT.TrimEnd('\') }
          $roots += @(
            'C:\Program Files\Git',
            'C:\Program Files (x86)\Git',
            "$env:LOCALAPPDATA\Programs\Git"
          ) | Where-Object { Test-Path $_ }

          if ($roots.Count -eq 0) {
            Write-Host 'No Git-for-Windows installation found; leaving PATH alone.'
          }

          $keep = $env:PATH -split ';' | Where-Object {
            $entry = $_
            if ([string]::IsNullOrWhiteSpace($entry)) { return $false }
            foreach ($root in $roots) {
              if ($entry -like "$root*") {
                Write-Host "dropping from PATH: $entry"
                return $false
              }
            }
            return $true
          }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p echo-app

      - name: Package (Windows)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "${{ inputs.version }}" } else { $env:GITHUB_REF_NAME }
          $stage = "echo-music-desktop-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/echo-music-desktop.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Copy-Item -Recurse assets "$stage/assets"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          "ARTIFACT=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish the release and attach the packaged artifact.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Echo Music Desktop ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            ## Echo Music Desktop ${{ steps.version.outputs.tag }}

            Ad-free YouTube Music streaming, synced lyrics and offline playback -
            the desktop port of [Echo Music](https://github.com/EchoMusicApp/Echo-Music).

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows (x64) | `echo-music-desktop-*-windows-x86_64.zip` |

            ### Running
            Extract the archive and launch `echo-music-desktop.exe`.

            > Echo Music hosts no copyrighted material. It is a client that streams
            > publicly available YouTube Music content. Support the artists you love
            > by subscribing to YouTube Premium.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
