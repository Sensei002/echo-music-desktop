name: CI

# Windows-only for now.
#
# Linux and macOS were dropped because the workspace failed to build on both and
# the hosts were not available to debug them. The Linux target is also the one
# that needs the full X11 / xkbcommon / freetype header set for Slint + cpal,
# which is a moving target. Add the targets back to the matrix once someone can
# reproduce a failure on the host itself.
#
# The Windows build previously failed at the link step because `link.exe` was
# resolved to the GNU `link` utility that ships with Git for Windows instead of
# the MSVC linker. The steps below remove the Git-bash bin directories from PATH
# before invoking cargo, and the build runs with `--locked` so the dependency
# graph cannot drift between runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting, lints and tests on Windows.
  # ---------------------------------------------------------------------------
  check:
    name: Check & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check

      # Drop the Git-for-Windows bin directories from PATH. `/usr/bin/link.exe`
      # is GNU coreutils `link`, and when it shadows the MSVC linker every
      # `cargo build` fails with "link: extra operand ... Try 'link --help'".
      #
      # GitHub exposes just the MSYS2 root as an environment variable, so the
      # candidates are filtered by string rather than by reading the whole PATH
      # back through PowerShell.
      #
      # Do NOT add a "verify link.exe is the MSVC one" probe here. A plain pwsh
      # step runs before the Rust toolchain loader initialises the MSVC
      # environment, so `link.exe` is legitimately absent at this point and the
      # probe fails on a perfectly healthy runner. Cargo locates the MSVC
      # linker itself once it starts building; if the wrong one ever wins
      # again, the build step below is what reports it.
      - name: Put the MSVC linker ahead of Git's
        shell: pwsh
        run: |
          $roots = @()
          if ($env:MSYS2_ROOT) { $roots += $env:MSYS2_ROOT.TrimEnd('\') }
          # The installer drops Git here; the runner image usually has it too.
          $roots += @(
            'C:\Program Files\Git',
            'C:\Program Files (x86)\Git',
            "$env:LOCALAPPDATA\Programs\Git"
          ) | Where-Object { Test-Path $_ }

          if ($roots.Count -eq 0) {
            Write-Host 'No Git-for-Windows installation found; leaving PATH alone.'
          }

          $keep = $env:PATH -split ';' | Where-Object {
            $entry = $_
            if ([string]::IsNullOrWhiteSpace($entry)) { return $false }
            foreach ($root in $roots) {
              if ($entry -like "$root*") {
                Write-Host "dropping from PATH: $entry"
                return $false
              }
            }
            return $true
          }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--locked` is deliberate: Cargo.lock is committed, and a re-resolve here
      # would silently test a dependency graph that nobody has built against.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Runs the unit/integration tests. Doctests are included: on this repo
      # there is exactly one, in `echo-innertube/src/lib.rs`, and it compiles.
      #
      # Note for anyone debugging a local failure of the shape
      #   Failed to spawn "...\rustc.exe": Os { code: 231,
      #       "All pipe instances are busy." }
      # that is ERROR_PIPE_BUSY from the doctest harness exhausting its
      # per-process pipe quota -- an environment limit, not a broken example.
      # `bash tools/doc-check.sh crates/<crate>` compiles the same doc examples
      # through a single rustc invocation and works around it.
      - name: Tests
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Release-shaped build, so linker problems surface before a tag is cut.
  # ---------------------------------------------------------------------------
  build:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-build

      - name: Put the MSVC linker ahead of Git's
        shell: pwsh
        run: |
          $roots = @()
          if ($env:MSYS2_ROOT) { $roots += $env:MSYS2_ROOT.TrimEnd('\') }
          $roots += @(
            'C:\Program Files\Git',
            'C:\Program Files (x86)\Git',
            "$env:LOCALAPPDATA\Programs\Git"
          ) | Where-Object { Test-Path $_ }

          if ($roots.Count -eq 0) {
            Write-Host 'No Git-for-Windows installation found; leaving PATH alone.'
          }

          $keep = $env:PATH -split ';' | Where-Object {
            $entry = $_
            if ([string]::IsNullOrWhiteSpace($entry)) { return $false }
            foreach ($root in $roots) {
              if ($entry -like "$root*") {
                Write-Host "dropping from PATH: $entry"
                return $false
              }
            }
            return $true
          }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p echo-app
