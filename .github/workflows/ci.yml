name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting — fast, no system dependencies needed.
  # ---------------------------------------------------------------------------
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Lints, tests and a full workspace check on Linux.
  #
  # This job is the primary failure signal, so nothing here may swallow an exit
  # code. In particular do not add `continue-on-error` to Clippy or Tests: a
  # tolerated failure at this stage just resurfaces as a confusing build error
  # in the `build` job two steps later.
  # ---------------------------------------------------------------------------
  check:
    name: Check & test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libxcb-randr0-dev libxcb-composite0-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-icccm4-dev libxcb-xkb-dev \
            libxcb-sync-dev libxcb-xinerama0-dev libxcb-cursor-dev \
            libx11-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Verify the app actually builds on every supported platform.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libxcb-randr0-dev libxcb-composite0-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-icccm4-dev libxcb-xkb-dev \
            libxcb-sync-dev libxcb-xinerama0-dev libxcb-cursor-dev \
            libx11-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `--locked` fails loudly if Cargo.lock is missing or out of date rather
      # than silently re-resolving the graph. Keep it on every build step.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p echo-app
